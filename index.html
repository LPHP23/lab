<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab</title>
    <script type="module" crossorigin src="/assets/index-B5Qt9EMX.js"></script>
  </head>
  <body>
    <!-- static check banner (visible even if React fails) -->
    <div id="static-check" style="position:fixed;left:12px;top:12px;padding:6px 10px;background:#0ea5e9;color:white;border-radius:6px;z-index:10000;font-family:system-ui;">Static: page loaded</div>
    <div id="root"></div>
    <script>
      // expose a global hook so app can report runtime errors back to the overlay
      window.__showError = function(msg) {
        try {
          const existing = document.querySelector('.__dev_error_overlay__');
          if (existing) existing.remove();
          const el = document.createElement('div');
          el.className = '__dev_error_overlay__';
          el.style.position = 'fixed';
          el.style.left = '0';
          el.style.right = '0';
          el.style.top = '0';
          el.style.background = 'rgba(200,30,30,0.95)';
          el.style.color = 'white';
          el.style.padding = '12px 16px';
          el.style.zIndex = '9999';
          el.style.fontFamily = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          el.textContent = msg;
          document.body.appendChild(el);
        } catch (e) {
          console.error('Failed to show error overlay', e);
        }
      };
    </script>
    <script>
      // Show runtime errors on the page to aid debugging (will be helpful during development)
      function showError(message) {
        const el = document.createElement('div');
        el.style.position = 'fixed';
        el.style.left = '0';
        el.style.right = '0';
        el.style.top = '0';
        el.style.background = 'rgba(200,30,30,0.95)';
        el.style.color = 'white';
        el.style.padding = '12px 16px';
        el.style.zIndex = '9999';
        el.style.fontFamily = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        el.textContent = message;
        document.body.appendChild(el);
      }

      window.addEventListener('error', (e) => {
        const message = 'Runtime error: ' + (e.message || (e.error && e.error.message) || e.filename || 'Unknown');
        if (window.__showError) window.__showError(message);
        console.error(e.error || e.message || e);
      });

      window.addEventListener('unhandledrejection', (e) => {
        const reason = e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason);
        const message = 'Unhandled rejection: ' + reason;
        if (window.__showError) window.__showError(message);
        console.error(e.reason);
      });
    </script>
  </body>
</html>
